<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog · Dr. Oscar Yendell</title>
<link rel="stylesheet" href="../design/colors_and_type.css" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="blog.css" />
<style>
  @page { size: letter; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body { padding: 0.5in 0.6in; background: var(--paper); }

  /* de-chrome for print */
  .site-header { position: static; backdrop-filter: none; }
  .header-contact { display: none !important; }
  .menu-btn { display: none !important; }
  .site-nav__links { position: static !important; display: flex !important; }
  .site-nav__links a::after { display: none; }
  .nav-cta { display: none !important; }

  /* always show reveal content */
  .reveal { opacity: 1 !important; transform: none !important; }

  .featured-card:hover, .post-card:hover, .filter-chip:hover { box-shadow: none; transform: none; }

  h1, h2, h3, .featured-card h2, .blog-coming__title { break-after: avoid; }
  .featured-card, .post-card, .blog-coming, .newsletter { break-inside: avoid; }
  p, li { orphans: 3; widows: 3; }

  .blog-controls__search { display: none !important; }

  *, *::before, *::after {
    animation-delay: -99s !important; animation-duration: .001s !important;
    animation-iteration-count: 1 !important; animation-fill-mode: both !important;
    animation-play-state: running !important; transition-duration: 0s !important;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../components/Common.jsx"></script>
<script type="text/babel" src="../components/Header.jsx"></script>
<script type="text/babel" src="../components/SiteFooter.jsx"></script>
<script type="text/babel" src="BlogList.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <>
      <Header active="blog" />
      <main>
        <BlogList />
      </main>
      <SiteFooter isBlog={true} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
addEventListener('load', () => {
  (async () => {
    const waitForContent = async () => {
      const start = Date.now();
      while (Date.now() - start < 8000) {
        if (document.querySelector('.featured-card')) return;
        await new Promise((r) => setTimeout(r, 50));
      }
    };
    await waitForContent();
    try { await document.fonts.ready; } catch (e) {}
    const imgs = Array.from(document.images).filter((i) => !i.complete);
    await Promise.race([
      Promise.allSettled(imgs.map((i) => i.decode())),
      new Promise((r) => setTimeout(r, 8000)),
    ]);
    setTimeout(() => window.print(), 500);
  })();
});
</script>
</body>
</html>
