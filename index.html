ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// The page content mounts async via React (and the babel scripts themselves
// load async), so the browser's native hash-scroll — e.g. arriving from
// blog/…html#kontakt — fires before the target section exists. One rAF isn't
// always enough (slow connections, first paint), so poll briefly instead.
if (window.location.hash) {
  const hash = window.location.hash;
  let tries = 0;
  const tryScroll = () => {
    const target = document.querySelector(hash);
    if (target) {
      const y = target.getBoundingClientRect().top + window.scrollY - 100;
      window.scrollTo(0, y);
    } else if (tries++ < 40) {
      setTimeout(tryScroll, 50);
    }
  };
  tryScroll();
}
</script>
